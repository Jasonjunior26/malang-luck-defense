  /* HUD 숫자 넘침 방지: 내용 기준 폭 + 축소 허용, 숫자 고정폭, 한 줄 */

  #a2hs { display:none; width:min(92vw,340px); align-items:center; gap:8px; background:#fffaf0cc; border:2px dashed var(--pink); border-radius:14px; padding:6px 8px 6px 12px; font-size:12px; line-height:1.3; text-align:left; } #a2hs.on { display:flex; } #a2hs span { flex:1; } #a2hs button { flex:none; min-width:44px; min-height:44px; padding:0; margin:-6px 0; font-size:16px; background:none; box-shadow:none; color:var(--ink); text-shadow:none; }
  /* 가로 모드: 왼쪽 캔버스, 오른쪽 조작부 */
  @media (orientation:landscape) and (max-height:560px) {
    #app { max-width:none; display:grid; grid-template-columns:auto minmax(0,1fr); grid-template-rows:auto auto auto auto; align-content:center; column-gap:10px; row-gap:6px; padding-top:calc(6px + env(safe-area-inset-top)); padding-bottom:calc(6px + env(safe-area-inset-bottom)); }
    #cvWrap { grid-column:1; grid-row:1 / 5; align-self:center; margin:0; }

    #title { flex-direction:column; flex-wrap:wrap; align-content:center; justify-content:center; gap:6px 14px; padding:8px; } .logo { font-size:34px; } #parade,#seasonBox,#todayBox { display:none !important; } #title .tbtn { height:44px; width:min(44vw,300px); } .tiny { display:none; } #a2hs { width:min(44vw,300px); }
    #box { max-height:96%; }
  }
</style>
</head>

<script>
// PWA: https 또는 localhost 에서만 서비스워커 등록. 새 버전이 준비되면 window 에 'sw-update' 이벤트.
try {
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        reg.addEventListener('updatefound', function () {
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function () {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              window.dispatchEvent(new CustomEvent('sw-update', { detail: { registration: reg } }));
            }
          });
        });
      }).catch(function (e) { console.warn('SW 등록 실패', e); });
    });
  }
} catch (e) { console.warn('SW 오류', e); }
</script>
