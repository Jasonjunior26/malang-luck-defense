  @font-face { font-family:"Pretendard"; font-weight:400; font-style:normal; font-display:swap; src:url(fonts/Pretendard-Regular.subset.woff2) format("woff2"); }

  :root {

    --tx-a55a00:#a55a00; --tx-d4182e:#d4182e; --tx-5a3aa8:#5a3aa8; --tx-7a4a1e:#7a4a1e; --tx-e0558a:#e0558a; --tx-d12a4f:#d12a4f; --tx-c98a00:#c98a00; --tx-b0001a:#b0001a; --tx-c9a56a:#c9a56a; --tx-d98a00:#d98a00; --tx-b06a00:#b06a00; --tx-c0392b:#c0392b; --tx-a06a00:#a06a00; --tx-a99a85:#a99a85; --tx-9a5a00:#9a5a00; --tx-c2410c:#c2410c; --tx-b91c1c:#b91c1c; --tx-8a7760:#8a7760;
    --sh1:#0001; --sh2:#0002; --sh3:#0003; --sh4:#0004; --sh6:#0006; --track:#0001;

  }

    --bg:#1c1830; --bg-a:#2a2445; --bg-b:#33233f; --surface:#38325a; --card:#2c2748; --rim:#443e6b; --ink:#ece6f7; --ink2:#c9c1dc; --ink3:#bdb4d2; --mute:#9990b0;
    --bg-fff4d6:#3a2f54; --bg-f3ecff:#35284b; --bg-dccbff:#3e305a; --bg-d7f0ff:#2d4654; --bg-ffeab0:#463965; --bg-fffdf5:#302746; --bg-fff1cf:#3c3157; --bg-f3e1b4:#483b68; --bg-fff0a8:#483b68; --bg-fff0f4:#492730; --bg-ffe0e0:#502b2b; --bg-ffb3b3:#653636; --bg-fff7d6:#3a2f54; --bg-ffe9a8:#483b68; --bg-ffe3d8:#392f53; --bg-ffb9a0:#4b3d6c; --bg-fff3d6:#3a2f54; --bg-f6f3ec:#362c4e; --bg-fdf1d8:#3a2f54; --bg-fff4c2:#40345d; --bg-fff6dc:#382e51; --bg-eee9e0:#3c3157; --bg-f7f2e9:#372c4f; --bg-fff0f5:#492733; --bg-f4efe6:#382e51; --bg-fff0b8:#433761; --bg-ffe3ec:#4f2b36;

    --tx-a55a00:#facd98; --tx-d4182e:#f28894; --tx-5a3aa8:#af9cdd; --tx-7a4a1e:#ebcbae; --tx-e0558a:#eb8fb2; --tx-d12a4f:#e991a4; --tx-c98a00:#f9d587; --tx-b0001a:#f993a2; --tx-c9a56a:#dcc49e; --tx-d98a00:#f8cd81; --tx-b06a00:#f9d193; --tx-c0392b:#e79b93; --tx-a06a00:#fada9b; --tx-a99a85:#b7afca; --tx-9a5a00:#fad49e; --tx-c2410c:#f8a786; --tx-b91c1c:#ee8c8c; --tx-8a7760:#b7afca;

  #hud { display:flex; gap:7px; }

  .chip .ico { font-size:22px; filter:drop-shadow(0 2px 0 var(--sh2)); }
  .chip div { flex:1; min-width:0; } .chip b { font-size:17px; display:block; line-height:1.1; }
  .chip.gold { flex:1.1; background:linear-gradient(#fff6c9,#ffe28a); } .chip.gold b { color:var(--tx-a55a00); font-size:var(--fs-title); }
  #hud { gap:5px; } .chip { padding:4px 7px; gap:4px; } .chip .ico { font-size:18px; } .chip b { font-size:15px; } .chip.gold b { font-size:17px; }
  #cWave { flex:1.5; } .chip.score { flex:1.1; background:linear-gradient(var(--bg-f3ecff),var(--bg-dccbff)); } .chip.score b { color:var(--tx-5a3aa8); font-size:17px; } .chip.urgent small#hCh { color:var(--tx-d4182e); }
  /* HUD 숫자 넘침 방지: 내용 기준 폭 + 축소 허용, 숫자 고정폭, 한 줄 */
  #hud { gap:3px; } .chip { flex:1 1 auto; padding:3px 5px; gap:3px; overflow:hidden; border-width:2px; } .chip .ico { font-size:var(--fs-body); flex:none; } .chip.score .ico { display:none; } #cWave, #cMob, .chip.gold { flex:1 1 auto; }
  .chip b, .chip small { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; min-width:0; }
  .chip b, .chip.score b, .chip.gold b { font-size:clamp(10.5px,3.3vw,12.5px); } .chip.gold b { flex:1; } #cWave b { font-size:clamp(10px,3.2vw,11.5px); }
  #hCh { font-size:clamp(9.5px,3vw,11px) !important; }
  @media (max-width:340px) { .chip .ico { font-size:var(--fs-cap); } .chip { padding:3px 4px; gap:2px; } }
  /* HUD 통일: 4칸 grid, 칩 높이 44px 고정, 아이콘 열 고정폭, 윗줄=숫자 / 아랫줄=라벨(작은 글씨), 진행바는 칩 바닥 3px 띠 */
  #hud { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1.15fr) minmax(0,1fr) minmax(0,1.2fr); gap:4px; }
  #hud .chip { margin:0 !important; align-self:start; text-shadow:none; position:relative; box-sizing:border-box; height:44px; min-width:0; padding:3px 5px 6px; gap:3px; align-items:center; overflow:hidden; border-width:2px; }
  #hud .chip .ico, #hud .chip.score .ico { display:grid !important; place-items:center; flex:none; width:16px; font-size:var(--fs-body); line-height:1; }
  #hud .chip > div { display:flex; flex-direction:column; justify-content:center; gap:1px; flex:1; min-width:0; }
  #hud .chip b, #hud .chip.gold b, #hud .chip.score b, #hud #cWave b { display:block; flex:none; font-size:clamp(11px,3.4vw,13px); line-height:1.15; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left; }
  #hud .chip small, #hud #hCh { display:block !important; font-size:clamp(9px,2.7vw,10.5px) !important; line-height:1.1; font-weight:700; opacity:.75; color:var(--tx-7a4a1e); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
  #hud .chip .bar { position:absolute; left:6px; right:6px; bottom:2px; height:3px; margin:0; border-radius:2px; }
  #hud .chip .bar u { border-radius:2px; }
  .chip.bump b { animation:bump .25s; } @keyframes bump { 50% { transform:scale(1.25); color:var(--tx-e0558a); } }
  .bar { display:block; height:7px; border-radius:5px; background:var(--track); overflow:hidden; margin-top:3px; }
  .bar u { display:block; height:100%; width:0; border-radius:5px; background:linear-gradient(90deg,#7cc4ff,#4a9be0); text-decoration:none; transition:width .2s; }
  .bar.danger u { background:linear-gradient(90deg,#8ee08e,#ffd24d); } .bar.danger.hot u { background:linear-gradient(90deg,#ff9a6b,#ff3d5e); }

  .card { flex:1; display:flex; align-items:center; gap:8px; background:var(--card); border:2.5px solid var(--rim); border-radius:16px; padding:5px 9px; box-shadow:0 3px 0 var(--ln-e2c58a); min-width:0; }
  .card canvas { width:38px; height:38px; flex:none; background:radial-gradient(var(--surface),var(--bg-ffeab0)); border-radius:50%; } .card .ico2 { width:38px; height:38px; flex:none; display:grid; place-items:center; font-size:22px; background:radial-gradient(var(--surface),var(--bg-d7f0ff)); border-radius:50%; }
  .card b { display:block; font-size:var(--fs-body); line-height:1.15; } .card small { display:block; font-size:11px; opacity:.75; line-height:1.2; }

  #cvWrap { position:relative; width:min(100%, calc((var(--vh,1vh)*100 - 270px) * 0.9)); flex:none; margin:0 auto; }
  canvas#cv { width:100%; aspect-ratio:360/400; display:block; border-radius:22px; border:4px solid var(--rim); box-shadow:0 5px 0 var(--ln-c9a56a),0 10px 18px var(--sh2); touch-action:none; background:#b9ec9f; }

  #bar { display:flex; gap:7px; }
  b, strong, h1, h2, h3 { font-weight:800; }
  #cWave b, #cMin b, #cScore b, #cWave small, #cMin small, #cScore small { font-variant-numeric:tabular-nums; }
  button { font:inherit; font-weight:800; border:0; color:#fff; cursor:pointer; position:relative; border-radius:var(--r-l); padding:10px 6px; background:linear-gradient(#ff9bbb,var(--pink)); box-shadow:0 5px 0 var(--pink2),0 8px 10px var(--sh2); text-shadow:0 2px 0 var(--sh3); transition:transform .06s; }
  button:active:not(:disabled) { transform:translateY(4px); box-shadow:0 1px 0 var(--pink2); }
  button:disabled { filter:grayscale(.6); opacity:.6; }
  button.big { flex:3.2; font-size:var(--fs-title); display:flex; flex-direction:column; align-items:center; line-height:1.1; padding:9px; }
  button.big small { font-size:13px; opacity:.95; margin-top:1px; }
  button.big.ready { animation:ready 1s 8 alternate; } @keyframes ready { to { transform:scale(1.03); } }
  button.mini { flex:1; font-size:var(--fs-title); display:flex; flex-direction:column; align-items:center; line-height:1.05; background:linear-gradient(#a5e8ff,var(--blue)); box-shadow:0 5px 0 var(--blue2),0 8px 10px var(--sh2); }
  button.mini small { font-size:11px; }
  button.green { background:linear-gradient(#9be8ad,var(--green)); box-shadow:0 5px 0 var(--green2),0 8px 10px var(--sh2); }
  button.wide { padding:13px 22px; font-size:19px; width:100%; margin-top:8px; }

  #modal,#title { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:16px; z-index:10; }
  #modal { background:#3b1f0ecc;  } #modal.on { display:flex; }
  #box { background:linear-gradient(var(--bg-fffdf5),var(--bg-fff1cf)); border:4px solid var(--rim); border-radius:26px; padding:18px; width:100%; max-width:380px; max-height:92%; overflow:auto; text-align:center; box-shadow:0 8px 0 var(--ln-c9a56a),0 20px 40px var(--sh4); animation:pop .35s cubic-bezier(.2,1.5,.4,1); }
  @keyframes pop { from { transform:scale(.6); opacity:0; } }
  #box h2 { margin:0 0 6px; font-size:26px; } #box input { font:inherit; font-size:18px; padding:10px; border-radius:var(--r-m); border:3px solid var(--ln-f0cf8a); width:80%; text-align:center; background:var(--surface); color:var(--ink); outline:0; user-select:text; -webkit-user-select:text; }
  .score { font-size:54px; line-height:1; color:var(--pink2); text-shadow:0 3px 0 #fff,0 5px 0 var(--sh1); margin:6px 0; } .tag { display:inline-block; background:var(--gold); color:#fff; border-radius:var(--r-s); padding:2px 10px; font-size:var(--fs-body); text-shadow:0 1px 0 var(--sh3); }

<script>
// PWA: https 또는 localhost 에서만 서비스워커 등록. 새 버전이 준비되면 window 에 'sw-update' 이벤트.
try {
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        reg.addEventListener('updatefound', function () {
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function () {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              window.dispatchEvent(new CustomEvent('sw-update', { detail: { registration: reg } }));
            }
          });
        });
      }).catch(function (e) { console.warn('SW 등록 실패', e); });
    });
  }
} catch (e) { console.warn('SW 오류', e); }
</script>
