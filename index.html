<style>
  :root { --ink:#5b3a1e; --card:#fffaf0; --pink:#ff7fa8; --pink2:#e0558a; --green:#6fd48a; --green2:#3fa95f; --gold:#ffb703; --blue:#7cc4ff; --blue2:#4a9be0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; color:var(--ink); font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; touch-action:manipulation; overflow:hidden; overscroll-behavior:none; position:fixed; inset:0; width:100%;
    background:radial-gradient(circle at 20% 10%,#fff3c4 0,transparent 45%),radial-gradient(circle at 85% 90%,#ffd1e0 0,transparent 40%),#ffe3a3; }
  #app { max-width:480px; margin:0 auto; height:100vh; height:100dvh; height:calc(var(--vh,1vh)*100); display:flex; flex-direction:column; padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left)); gap:7px; }

  #hud { display:flex; gap:7px; }
  .chip { flex:1; display:flex; align-items:center; gap:7px; background:linear-gradient(#fff,#fff4d6); border:2.5px solid #fff; border-radius:16px; padding:5px 10px; box-shadow:0 3px 0 #e2c58a,0 6px 10px #0001; min-width:0; }
  .chip .ico { font-size:22px; filter:drop-shadow(0 2px 0 #0002); }
  .chip div { flex:1; min-width:0; } .chip b { font-size:17px; display:block; line-height:1.1; }
  .chip.gold { flex:1.1; background:linear-gradient(#fff6c9,#ffe28a); } .chip.gold b { color:#a55a00; font-size:20px; }
  #hud { gap:5px; } .chip { padding:4px 7px; gap:4px; } .chip .ico { font-size:18px; } .chip b { font-size:15px; } .chip.gold b { font-size:17px; }
  #cWave { flex:1.5; } .chip.score { flex:1.1; background:linear-gradient(#f3ecff,#dccbff); } .chip.score b { color:#5a3aa8; font-size:17px; } .chip.urgent small#hCh { color:#d4182e; }
  /* HUD 숫자 넘침 방지: 내용 기준 폭 + 축소 허용, 숫자 고정폭, 한 줄 */
  #hud { gap:3px; } .chip { flex:1 1 auto; padding:3px 5px; gap:3px; overflow:hidden; border-width:2px; } .chip .ico { font-size:14px; flex:none; } .chip.score .ico { display:none; } #cWave, #cMob, .chip.gold { flex:1 1 auto; }
  .chip b, .chip small { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; min-width:0; }
  .chip b, .chip.score b, .chip.gold b { font-size:clamp(10.5px,3.3vw,12.5px); } .chip.gold b { flex:1; } #cWave b { font-size:clamp(10px,3.2vw,11.5px); }
  #hCh { font-size:clamp(9.5px,3vw,11px) !important; }
  @media (max-width:340px) { .chip .ico { font-size:12px; } .chip { padding:3px 4px; gap:2px; } }
  /* HUD 통일: 4칸 grid, 칩 높이 44px 고정, 아이콘 열 고정폭, 윗줄=숫자 / 아랫줄=라벨(작은 글씨), 진행바는 칩 바닥 3px 띠 */
  #hud { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1.15fr) minmax(0,1fr) minmax(0,1.2fr); gap:4px; }
  #hud .chip { margin:0 !important; align-self:start; text-shadow:none; position:relative; box-sizing:border-box; height:44px; min-width:0; padding:3px 5px 6px; gap:3px; align-items:center; overflow:hidden; border-width:2px; }
  #hud .chip .ico, #hud .chip.score .ico { display:grid !important; place-items:center; flex:none; width:16px; font-size:14px; line-height:1; }
  #hud .chip > div { display:flex; flex-direction:column; justify-content:center; gap:1px; flex:1; min-width:0; }
  #hud .chip b, #hud .chip.gold b, #hud .chip.score b, #hud #cWave b { display:block; flex:none; font-size:clamp(11px,3.4vw,13px); line-height:1.15; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left; }
  #hud .chip small, #hud #hCh { display:block !important; font-size:clamp(9px,2.7vw,10.5px) !important; line-height:1.1; font-weight:700; opacity:.75; color:#7a4a1e; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
  #hud .chip .bar { position:absolute; left:6px; right:6px; bottom:2px; height:3px; margin:0; border-radius:2px; }
  #hud .chip .bar u { border-radius:2px; }
  .chip.bump b { animation:bump .25s; } @keyframes bump { 50% { transform:scale(1.25); color:#e0558a; } }
  .bar { display:block; height:7px; border-radius:5px; background:#0001; overflow:hidden; margin-top:3px; }
  .bar u { display:block; height:100%; width:0; border-radius:5px; background:linear-gradient(90deg,#7cc4ff,#4a9be0); text-decoration:none; transition:width .2s; }
  .bar.danger u { background:linear-gradient(90deg,#8ee08e,#ffd24d); } .bar.danger.hot u { background:linear-gradient(90deg,#ff9a6b,#ff3d5e); }

  .card { flex:1; display:flex; align-items:center; gap:8px; background:var(--card); border:2.5px solid #fff; border-radius:16px; padding:5px 9px; box-shadow:0 3px 0 #e2c58a; min-width:0; }

  .card b { display:block; font-size:14px; line-height:1.15; } .card small { display:block; font-size:11px; opacity:.75; line-height:1.2; }

  button.wide { padding:13px 22px; font-size:19px; width:100%; margin-top:8px; }

  #modal,#title { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:16px; z-index:10; }
  #modal { background:#3b1f0ecc;  } #modal.on { display:flex; }

  @keyframes pop { from { transform:scale(.6); opacity:0; } }
  #box h2 { margin:0 0 6px; font-size:26px; } #box input { font:inherit; font-size:18px; padding:10px; border-radius:14px; border:3px solid #f0cf8a; width:80%; text-align:center; background:#fff; color:var(--ink); outline:0; user-select:text; -webkit-user-select:text; }
  .score { font-size:54px; line-height:1; color:var(--pink2); text-shadow:0 3px 0 #fff,0 5px 0 #0001; margin:6px 0; } .tag { display:inline-block; background:var(--gold); color:#fff; border-radius:10px; padding:2px 10px; font-size:14px; text-shadow:0 1px 0 #0003; }
  .tabs { display:flex; gap:6px; margin:8px 0; } .tabs button { flex:1; min-height:44px; padding:7px; font-size:15px; background:#f3e1b4; box-shadow:0 3px 0 #d8bf86; color:var(--ink); text-shadow:none; } .tabs button.on { background:var(--pink); color:#fff; box-shadow:0 3px 0 var(--pink2); }
  .rows { text-align:left; margin:0; padding:0; list-style:none; } .rows li { flex-wrap:wrap; display:flex; align-items:center; gap:8px; padding:7px 10px; margin-bottom:5px; border-radius:12px; background:#fff; font-size:15px; }
  .rows li.me { background:#fff0a8; outline:3px solid var(--gold); animation:glow 1s 8 alternate; } @keyframes glow { to { transform:scale(1.025); } }
  .rows .no { width:28px; text-align:center; font-size:18px; } .rows .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .rows .sc { color:var(--pink2); } .rows small { opacity:.6; font-size:11px; display:block; text-align:right; } .rows small.bd { flex-basis:100%; text-align:left; opacity:.75; font-size:10.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* 프라이빗 시즌 (seasons.js) */
  #title .trow { display:flex; gap:8px; width:min(92vw,340px); flex:none; } #title .trow .tbtn { flex:1; width:auto; min-width:0; }

  .ps .pstxt { margin:6px 0; font-size:14px; line-height:1.4; text-align:center; } .ps .psbad { color:#d12a4f; min-height:18px; font-size:13px; }
  .ps .psh { margin:10px 0 4px; font-size:13px; font-weight:bold; opacity:.75; }
  .ps .pschips { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0; min-width:0; } .ps .pschip { max-width:100%; box-sizing:border-box; padding:2px 8px; border-radius:10px; background:#fff; border:2px solid #f0cf8a; font-size:12px; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
  .ps .psinfo { display:flex; flex-wrap:wrap; gap:4px 12px; justify-content:center; font-size:13px; margin:6px 0; font-variant-numeric:tabular-nums; }
  .ps .psb { display:flex; align-items:center; justify-content:center; width:100%; min-height:44px; margin-top:8px; padding:0 14px; box-sizing:border-box; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-radius:14px; }
  .ps .psb.g { background:#fffaf0; color:var(--ink); text-shadow:none; box-shadow:none; border:3px solid var(--pink); }
  .ps .psrow { display:block; width:100%; box-sizing:border-box; min-height:44px; margin:6px 0 0; padding:8px 12px; text-align:left; color:var(--ink); text-shadow:none; background:#fff; border:3px solid #f0cf8a; box-shadow:none; border-radius:14px; }
  .ps .psrow.sel { border-color:var(--pink); background:#fff0f4; } .ps .psrow .psn { display:block; font-size:16px; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ps .psrow .psm { float:right; font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap; } .ps .psrow .psr { color:var(--pink2); font-weight:bold; }
  .ps .psmod { display:flex; align-items:center; gap:8px; margin:6px 0; min-height:44px; } .ps .psmod .psn { flex:1; min-width:0; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .ps .psmod b { min-width:62px; text-align:center; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .ps .psmod input[type=date], .ps .psmod select { width:auto; flex:none; font-size:15px; padding:8px; min-height:44px; box-sizing:border-box; }
  .ps .psst { width:44px; height:44px; padding:0; font-size:20px; flex:none; border-radius:12px; } .ps .psst.cl { background:#fff; color:var(--ink); text-shadow:none; box-shadow:none; border:3px solid #f0cf8a; } .ps .psst.cl.on { border-color:var(--pink); background:#fff0f4; }
  .ps .pstogs { display:flex; flex-wrap:wrap; gap:6px; } .ps .pstog { min-height:44px; padding:0 12px; font-size:14px; white-space:nowrap; background:#fff; color:var(--ink); text-shadow:none; box-shadow:none; border:3px solid #f0cf8a; border-radius:14px; } .ps .pstog.on { border-color:var(--pink); background:#fff0f4; font-weight:bold; }
  .ps .psdots { display:flex; justify-content:center; gap:6px; margin-bottom:6px; } .ps .psdots i { width:8px; height:8px; border-radius:50%; background:#e3cfa0; } .ps .psdots i.on { background:var(--pink); }
  .ps .psbd { max-height:30vh; overflow:auto; margin-top:6px; } .ps .psbd .nm { min-width:0; } .ps .psbd .sc { font-variant-numeric:tabular-nums; white-space:nowrap; } .ps .psme { position:sticky; bottom:0; text-align:center; font-weight:bold; background:#fff0a8; border-radius:12px; padding:6px; font-size:14px; font-variant-numeric:tabular-nums; }
  .ps .pscode { text-align:center; font-size:30px; font-weight:bold; letter-spacing:4px; margin:4px 0; font-variant-numeric:tabular-nums; } .ps .psurl { font-size:11px; opacity:.6; text-align:center; word-break:break-all; user-select:text; -webkit-user-select:text; }
  .ps input { width:100%; box-sizing:border-box; }

  #title { background:radial-gradient(circle at 50% 20%,#fff7d0,#ffd98a 60%,#ffb98a); flex-direction:column; text-align:center; gap:6px; } #title.on { display:flex; }
  .logo { font-size:50px; line-height:1.02; color:#fff; -webkit-text-stroke:2px #e0558a; paint-order:stroke fill; text-shadow:0 5px 0 #e0558a,0 10px 14px #0003; animation:float 2.2s ease-in-out infinite; } .logo span { color:#fff4a8; -webkit-text-stroke-color:#e08a00; text-shadow:0 5px 0 #e08a00,0 10px 14px #0003; }
  @keyframes float { 50% { transform:translateY(-8px) rotate(-1deg); } }
  #parade { width:min(92vw,340px); height:auto; aspect-ratio:340/150; display:block; }
  .tiny { font-size:12px; opacity:.7; margin:0; }
  /* 타이틀 전용 버튼: 동일 너비/높이/폰트/정중앙 */

  #title .tbtn.secondary { background:linear-gradient(#a5e8ff,var(--blue)); box-shadow:0 5px 0 var(--blue2),0 8px 10px #0002; }
  #title #start, #title #startMine { font-size:clamp(14px,4.6vw,18px); }

  #title { gap:10px; }

  /* ---- 스운디 UI ---- */
  #cWave.boss { background:linear-gradient(#ffe0e0,#ffb3b3); } #cWave.boss.urgent { animation:pulse .5s infinite alternate; } @keyframes pulse { to { transform:scale(1.04); } } #cWave.boss.urgent b { color:#d4182e; }

  #confirm { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:20px; z-index:20; background:#3b1f0e99; } #confirm.on { display:flex; } #cbox { background:#fffdf5; border:4px solid #fff; border-radius:22px; padding:16px; width:100%; max-width:320px; text-align:center; box-shadow:0 8px 0 #c9a56a; line-height:1.4; } #cbox .row { display:flex; gap:8px; } #cbox .row button { flex:1; margin-top:10px; padding:10px; }
  .gb { display:inline-block; min-width:44px; color:#fff; border-radius:9px; padding:0 7px; font-size:13px; text-shadow:0 1px 0 #0004; }

  .pk { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:8px 0; } .pk .opt { background:#fff; border:3px solid var(--gc,#ddd); border-radius:16px; padding:8px 4px; cursor:pointer; font-size:13px; line-height:1.3; } .pk .opt:active { transform:scale(.96); } .pk .opt canvas { width:56px; height:56px; display:block; margin:0 auto 2px; } .pk .opt.dim { opacity:.45; }

  .cgd { margin-top:4px; font-size:12px; text-align:left; } .cgd summary { cursor:pointer; text-align:center; opacity:.65; } .cgd ul { list-style:none; margin:4px 0 0; padding:0; } .cgd li { padding:1px 4px; } .cgd li b { float:right; }

  #box .mkc.max { border-color:#ffd77a; background:#fffaf0; } #box .mkc.max .mkst { background:#fff0b8; color:#b06a00; font-weight:800; }

  #box .mkc.got { animation:mkgot .45s ease-out; } @keyframes mkgot { 40% { transform:scale(1.05); border-color:var(--gold); } }
  /* 장착 */

  #box .eqhd { display:flex; align-items:center; justify-content:center; gap:8px; } #box .eqhd canvas { width:40px; }

  #box .eqs small { font-size:10px; opacity:.8; } #box .eqs.on { color:var(--ink); border:2px solid var(--pink); background:#fff0f5; }
  #box .eqs:disabled { filter:none; opacity:1; }
  #box .eqsk { display:flex; flex-wrap:wrap; gap:4px; }

  #box .eqsk button.on { border-color:var(--pink); background:#ffe3ec; }
  #box .eqn li { flex-wrap:nowrap; gap:4px; padding:5px 6px; } #box .eqn li.off { opacity:.6; }
  #box .eqn .nm { font-size:13px; min-width:0; white-space:normal; } #box .eqn .nm small { text-align:left; white-space:normal; word-break:keep-all; line-height:1.25; opacity:.65; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

<script>
// PWA: https 또는 localhost 에서만 서비스워커 등록. 새 버전이 준비되면 window 에 'sw-update' 이벤트.
try {
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        reg.addEventListener('updatefound', function () {
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function () {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              window.dispatchEvent(new CustomEvent('sw-update', { detail: { registration: reg } }));
            }
          });
        });
      }).catch(function (e) { console.warn('SW 등록 실패', e); });
    });
  }
} catch (e) { console.warn('SW 오류', e); }
</script>
